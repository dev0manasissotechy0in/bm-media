<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Unified Authentication</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        .section { margin: 30px 0; padding: 20px; border: 1px solid #ddd; border-radius: 5px; }
        input, button { padding: 10px; margin: 5px 0; width: 100%; }
        button { background: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
        .result { margin-top: 10px; padding: 10px; background: #f8f9fa; border-radius: 3px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>🔐 Test Unified Authentication API</h1>

    <!-- Register Section -->
    <div class="section">
        <h2>1. Register New User</h2>
        <input type="email" id="reg-email" placeholder="Email">
        <input type="tel" id="reg-phone" placeholder="Phone (optional)">
        <input type="text" id="reg-name" placeholder="Full Name">
        <input type="password" id="reg-password" placeholder="Password (min 6 chars)">
        <button onclick="register()">Register</button>
        <div id="register-result" class="result"></div>
    </div>

    <!-- Login Section -->
    <div class="section">
        <h2>2. Login</h2>
        <input type="text" id="login-identifier" placeholder="Email or Phone">
        <input type="password" id="login-password" placeholder="Password">
        <button onclick="login()">Login</button>
        <div id="login-result" class="result"></div>
    </div>

    <!-- Get Profile Section -->
    <div class="section">
        <h2>3. Get Profile (After Login)</h2>
        <input type="text" id="profile-token" placeholder="Token (auto-filled after login)">
        <button onclick="getProfile()">Get Profile</button>
        <div id="profile-result" class="result"></div>
    </div>

    <!-- Logout Section -->
    <div class="section">
        <h2>4. Logout</h2>
        <button onclick="logout()">Logout</button>
        <div id="logout-result" class="result"></div>
    </div>

    <script>
        const API_BASE = '/api/auth';
        let currentToken = '';

        async function register() {
            const email = document.getElementById('reg-email').value;
            const phone = document.getElementById('reg-phone').value;
            const name = document.getElementById('reg-name').value;
            const password = document.getElementById('reg-password').value;

            try {
                const response = await fetch(`${API_BASE}/register.php`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, phone, password, full_name: name })
                });
                const data = await response.json();
                
                const resultDiv = document.getElementById('register-result');
                if (data.success) {
                    currentToken = data.token;
                    document.getElementById('profile-token').value = data.token;
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `<strong>Success!</strong><br>
                        User ID: ${data.user.id}<br>
                        Token: ${data.token.substring(0, 20)}...<br>
                        <pre>${JSON.stringify(data.user, null, 2)}</pre>`;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.textContent = 'Error: ' + data.message;
                }
            } catch (error) {
                document.getElementById('register-result').className = 'result error';
                document.getElementById('register-result').textContent = 'Error: ' + error.message;
            }
        }

        async function login() {
            const identifier = document.getElementById('login-identifier').value;
            const password = document.getElementById('login-password').value;

            try {
                const response = await fetch(`${API_BASE}/login.php`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identifier, password })
                });
                const data = await response.json();
                
                const resultDiv = document.getElementById('login-result');
                if (data.success) {
                    currentToken = data.token;
                    document.getElementById('profile-token').value = data.token;
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `<strong>Login Successful!</strong><br>
                        Token: ${data.token.substring(0, 20)}...<br>
                        <pre>${JSON.stringify(data.user, null, 2)}</pre>`;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.textContent = 'Error: ' + data.message;
                }
            } catch (error) {
                document.getElementById('login-result').className = 'result error';
                document.getElementById('login-result').textContent = 'Error: ' + error.message;
            }
        }

        async function getProfile() {
            const token = document.getElementById('profile-token').value || currentToken;

            try {
                const response = await fetch(`${API_BASE}/profile.php`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                
                const resultDiv = document.getElementById('profile-result');
                if (data.success) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `<strong>Profile Retrieved!</strong>
                        <pre>${JSON.stringify(data.user, null, 2)}</pre>`;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.textContent = 'Error: ' + data.message;
                }
            } catch (error) {
                document.getElementById('profile-result').className = 'result error';
                document.getElementById('profile-result').textContent = 'Error: ' + error.message;
            }
        }

        async function logout() {
            const token = document.getElementById('profile-token').value || currentToken;

            try {
                const response = await fetch(`${API_BASE}/logout.php`, {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                const data = await response.json();
                
                const resultDiv = document.getElementById('logout-result');
                if (data.success) {
                    currentToken = '';
                    document.getElementById('profile-token').value = '';
                    resultDiv.className = 'result success';
                    resultDiv.textContent = data.message;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.textContent = 'Error: ' + data.message;
                }
            } catch (error) {
                document.getElementById('logout-result').className = 'result error';
                document.getElementById('logout-result').textContent = 'Error: ' + error.message;
            }
        }
    </script>
</body>
</html>
