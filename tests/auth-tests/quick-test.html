<!DOCTYPE html>
<html>
<head>
    <title>Quick API Test</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f5f5f5; }
        .box { background: white; padding: 20px; border-radius: 8px; margin: 10px 0; }
        .success { background: #d1fae5; border: 2px solid #10b981; }
        .error { background: #fee2e2; border: 2px solid #ef4444; }
        button { padding: 10px 20px; background: #2563eb; color: white; border: none; border-radius: 5px; cursor: pointer; }
        pre { white-space: pre-wrap; word-wrap: break-word; }
    </style>
</head>
<body>
    <h1>🔍 Quick API Connection Test</h1>
    
    <div class="box">
        <h3>Step 1a: Test MySQL Connection</h3>
        <button onclick="testMySQL()">Test MySQL</button>
        <div id="mysql"></div>
    </div>

    <div class="box">
        <h3>Step 1b: Test Basic API Connection</h3>
        <button onclick="testBasic()">Test API Connection</button>
        <div id="basic"></div>
    </div>

    <div class="box">
        <h3>Step 2: Test Send OTP (Direct Test - No Email)</h3>
        <input type="email" id="email" placeholder="manas8teen@gmail.com" value="manas8teen@gmail.com" style="padding: 8px; width: 250px;">
        <button onclick="testOTPDirect()">Test OTP (Direct)</button>
        <button onclick="testOTP()" style="background: #059669;">Test OTP (Full)</button>
        <div id="otp"></div>
    </div>

    <script>
        const API = window.location.origin;

        async function testMySQL() {
            const div = document.getElementById('mysql');
            div.innerHTML = 'Testing MySQL...';
            
            try {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 10000);
                
                const response = await fetch(`${API}/test-mysql.php`, {
                    signal: controller.signal
                });
                clearTimeout(timeout);
                
                const text = await response.text();
                console.log('Response:', text);
                
                try {
                    const data = JSON.parse(text);
                    let className = 'success';
                    if (data.step1_direct_connection !== 'SUCCESS' || 
                        data.step2_pdo_connection !== 'SUCCESS' ||
                        data.step3_database_class !== 'SUCCESS') {
                        className = 'error';
                    }
                    div.innerHTML = `<div class="box ${className}"><pre>${JSON.stringify(data, null, 2)}</pre></div>`;
                } catch (parseError) {
                    div.innerHTML = `<div class="box error"><strong>NOT JSON:</strong><pre>${text}</pre></div>`;
                }
            } catch (error) {
                if (error.name === 'AbortError') {
                    div.innerHTML = `<div class="box error"><strong>TIMEOUT:</strong> Request took longer than 10 seconds</div>`;
                } else {
                    div.innerHTML = `<div class="box error"><strong>ERROR:</strong> ${error.message}</div>`;
                }
            }
        }

        async function testBasic() {
            const div = document.getElementById('basic');
            div.innerHTML = 'Testing...';
            
            try {
                const response = await fetch(`${API}/api/test-connection.php`);
                const data = await response.json();
                div.innerHTML = `<div class="box success"><pre>${JSON.stringify(data, null, 2)}</pre></div>`;
            } catch (error) {
                div.innerHTML = `<div class="box error"><strong>ERROR:</strong> ${error.message}<br><br>
                    <strong>Possible issues:</strong><br>
                    1. XAMPP is not running<br>
                    2. Wrong IP address (current: ${API})<br>
                    3. Apache is not started<br>
                    4. Firewall blocking connection</div>`;
            }
        }

        async function testOTPDirect() {
            const div = document.getElementById('otp');
            const email = document.getElementById('email').value;
            div.innerHTML = 'Testing OTP (Direct - No Email)...';
            
            try {
                const url = `${API}/api/auth/test-otp.php`;
                console.log('Testing direct OTP at:', url);
                
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 10000); // 10s timeout
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email }),
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);
                
                const text = await response.text();
                console.log('Direct test response:', text);
                
                const data = JSON.parse(text);
                
                if (data.success) {
                    div.innerHTML = `<div class="box success">
                        <strong>✅ OTP Generated!</strong><br><br>
                        <strong style="font-size: 24px; color: #dc2626;">OTP: ${data.otp}</strong><br><br>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    </div>`;
                } else {
                    div.innerHTML = `<div class="box error">
                        <strong>❌ Error at step: ${data.step}</strong><br><br>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    </div>`;
                }
            } catch (error) {
                console.error('Direct test error:', error);
                if (error.name === 'AbortError') {
                    div.innerHTML = `<div class="box error">
                        <strong>⏱️ TIMEOUT:</strong> Request took longer than 10 seconds<br><br>
                        Possible causes:<br>
                        1. Database connection is slow/failing<br>
                        2. MySQL is not running<br>
                        3. Database 'news_website' doesn't exist<br>
                        4. Check XAMPP MySQL service
                    </div>`;
                } else {
                    div.innerHTML = `<div class="box error">
                        <strong>ERROR:</strong> ${error.message}
                    </div>`;
                }
            }
        }

        async function testOTP() {
            const div = document.getElementById('otp');
            const email = document.getElementById('email').value;
            div.innerHTML = 'Sending OTP (Full with Email)...';
            
            try {
                console.log('Sending to:', `${API}/api/auth/send-otp.php`);
                
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 30000); // 30s timeout
                
                const response = await fetch(`${API}/api/auth/send-otp.php`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        email: email, 
                        name: 'Test User',
                        user_type: 'user' 
                    }),
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);

                console.log('Status:', response.status);
                const text = await response.text();
                console.log('Raw response:', text);
                
                let data;
                try {
                    data = JSON.parse(text);
                } catch (e) {
                    throw new Error('Invalid JSON: ' + text.substring(0, 200));
                }

                if (data.success) {
                    let html = `<div class="box success"><pre>${JSON.stringify(data, null, 2)}</pre>`;
                    if (data.debug && data.debug.otp) {
                        html += `<br><br><strong style="font-size: 20px; color: #dc2626;">Your OTP: ${data.debug.otp}</strong><br>
                        <small>Copy this code to use in Verify OTP test</small>`;
                    }
                    html += '</div>';
                    div.innerHTML = html;
                } else {
                    div.innerHTML = `<div class="box error"><pre>${JSON.stringify(data, null, 2)}</pre></div>`;
                }
            } catch (error) {
                console.error('Full error:', error);
                if (error.name === 'AbortError') {
                    div.innerHTML = `<div class="box error">
                        <strong>⏱️ TIMEOUT:</strong> Request took longer than 30 seconds<br><br>
                        This usually means email sending is hanging.<br>
                        Try the "Test OTP (Direct)" button instead.
                    </div>`;
                } else {
                    div.innerHTML = `<div class="box error"><strong>ERROR:</strong> ${error.message}<br><br>
                        <strong>Check browser console for details</strong></div>`;
                }
            }
        }
    </script>
</body>
</html>
