name: news_app
description: A new Flutter application.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 6.0.4+42

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP client for API calls
  http: ^1.2.0
  
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.5
  easy_localization: ^3.0.7+1
  flutter_web_browser: ^0.17.3
  flutter_html: ^3.0.0
  google_fonts: ^6.2.1
  html_unescape: ^2.0.0
  image_picker: ^1.1.2
  introduction_screen: ^4.0.0
  store_redirect: ^2.0.4
  lottie: ^3.3.1
  path_provider: ^2.0.15
  share_plus: ^12.0.0
  shared_preferences: ^2.5.3
  fluttertoast: ^9.0.0
  url_launcher: ^6.3.0
  rounded_loading_button_plus: ^3.0.1
  hive_flutter: ^1.1.0
  loading_indicator: ^3.1.0
  reading_time: ^2.0.0
  last_pod_player: ^0.0.6
  google_mobile_ads: ^6.0.0
  app_settings: ^6.1.1
  flutter_riverpod: ^2.5.1
  flutter_svg: ^2.1.0
  line_icons: ^2.0.3
  feather_icons: ^1.2.0
  shimmer: ^3.0.0
  material_dialogs: ^1.1.5
  simple_animations: ^5.2.0
  quiver: ^3.2.1
  carousel_slider: ^5.0.0
  just_audio: ^0.10.3
  audioplayers: ^6.1.0
  icons_plus: ^5.0.0
  package_info_plus: ^9.0.0
  otp_text_field: ^1.1.3
  crypto: ^3.0.3
  html: ^0.15.6
  dots_indicator: ^4.0.1
  youtube_player_flutter: ^9.1.1
  
  # Deep Linking (using app_links only - modern replacement for uni_links)
  app_links: ^6.3.4
  
  # In-App Update
  in_app_update: ^4.2.3
  
  # Video Player for reels
  video_player: ^2.9.1
  
  # Text-to-Speech
  flutter_tts: ^4.2.0
  
  # Keep Firebase only for analytics, messaging, and auth (optional)
  # Remove Firestore and Storage
  firebase_core: ^4.2.0
  firebase_analytics: ^12.0.3
  firebase_messaging: ^16.0.3
  firebase_auth: ^6.1.1



dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: "^0.14.3"
  change_app_package_name: ^1.5.0
  flutter_lints: ^4.0.0





flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icon.png"



# The following section is specific to Flutter.
flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/animation_files/
    - assets/translations/
  
  # Uncomment when Westack font files are added to assets/fonts/westack/
